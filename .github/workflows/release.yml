#!/usr/bin/env bash
# build_release.sh - assemble zygisk-detach-*.zip yang siap di-flash Magisk/KernelSU
#
# PRASYARAT (harus sudah terpasang di mesin kamu, bukan di sini):
#   - Android NDK (untuk compile module/jni -> zygisk/*.so)
#   - Rust nightly + target Android untuk cli (aarch64-linux-android,
#     armv7-linux-androideabi, i686-linux-android, x86_64-linux-android)
#   - Node.js/Bun (untuk build ksu-webui dengan parcel)
#   - `zip`
#
# Jalankan dari root repo: ./build_release.sh
set -euo pipefail

ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
OUT="$ROOT/out"
STAGE="$OUT/stage"
rm -rf "$OUT"
mkdir -p "$STAGE/zygisk" "$STAGE/bin"

VERSION=$(grep -m1 '^version=' "$ROOT/module/module.prop" | cut -d= -f2)
VERSION_CODE=$(grep -m1 '^versionCode=' "$ROOT/module/module.prop" | cut -d= -f2)
ZIP_NAME="zygisk-detach-${VERSION}.zip"

echo "==> [1/4] Build zygisk native module (.so per ABI)"
: "${ANDROID_NDK_HOME:?set ANDROID_NDK_HOME to your NDK path}"
declare -A ABI_TRIPLE=(
	[arm64-v8a]="aarch64-linux-android24"
	[armeabi-v7a]="armv7a-linux-androideabi24"
	[x86]="i686-linux-android24"
	[x86_64]="x86_64-linux-android24"
)
TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
for abi in "${!ABI_TRIPLE[@]}"; do
	triple="${ABI_TRIPLE[$abi]}"
	echo "  - $abi ($triple)"
	"$TOOLCHAIN/${triple}-clang++" -shared -fPIC -O2 -Wall \
		-I"$ROOT/zygisk/jni" \
		"$ROOT/zygisk/jni/module.cpp" "$ROOT/zygisk/jni/binder.cpp" \
		-llog -o "$STAGE/zygisk/${abi}.so"
done

echo "==> [2/4] Build cli 'detach' binary per arch"
declare -A RUST_TARGET=(
	[arm64]="aarch64-linux-android"
	[arm]="armv7-linux-androideabi"
	[x64]="x86_64-linux-android"
	[x86]="i686-linux-android"
)
pushd "$ROOT/cli" >/dev/null
for arch in "${!RUST_TARGET[@]}"; do
	target="${RUST_TARGET[$arch]}"
	echo "  - $arch ($target)"
	rustup target add "$target" >/dev/null
	cargo +nightly build --profile release-pr --target "$target"
	mkdir -p "$STAGE/bin/$arch"
	cp "target/$target/release-pr/cli" "$STAGE/bin/$arch/detach"
	# ksu_profile: taruh binary prebuilt-mu sendiri di sini kalau punya,
	# kalau tidak, hapus baris pemanggilannya di module/customize.sh -
	# itu cuma dipakai untuk auto-set profile KernelSU, bukan wajib.
	if [ -f "$ROOT/prebuilt/ksu_profile-$arch" ]; then
		cp "$ROOT/prebuilt/ksu_profile-$arch" "$STAGE/bin/$arch/ksu_profile"
	fi
done
popd >/dev/null

echo "==> [3/4] Build ksu-webui"
pushd "$ROOT/ksu-webui" >/dev/null
npm install
npx parcel build src/index.html --dist-dir dist --public-url .
mkdir -p "$STAGE/webroot"
cp -r dist/* "$STAGE/webroot/"
popd >/dev/null

echo "==> [4/4] Assemble zip"
cp -r "$ROOT/module/META-INF" "$STAGE/"
cp "$ROOT/module/module.prop" "$ROOT/module/customize.sh" "$ROOT/module/post-fs-data.sh" "$STAGE/"
chmod +x "$STAGE/customize.sh" "$STAGE/post-fs-data.sh"

pushd "$STAGE" >/dev/null
zip -r9 "$OUT/$ZIP_NAME" . -x '.*'
popd >/dev/null

echo ""
echo "Selesai: $OUT/$ZIP_NAME (module.prop version=$VERSION versionCode=$VERSION_CODE)"
