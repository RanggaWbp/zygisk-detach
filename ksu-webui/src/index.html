<!DOCTYPE html>
<html lang="id">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<title>zygisk-detach</title>
	<link rel="stylesheet" href="styles.css" type="text/css">
	<script type="module" crossorigin src="index.js" type="text/javascript"></script>
</head>

<body>
	<header class="topbar">
		<div class="title-row">
			<h1>Detach</h1>
			<span class="stat-pill" id="stat-pill">0 / 0 detached</span>
		</div>
		<div class="search-row">
			<svg class="search-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
				<circle cx="9" cy="9" r="6.5" stroke="currentColor" stroke-width="1.6" />
				<path d="M18 18L14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
			</svg>
			<input type="text" class="search-input" id="search" placeholder="Cari nama paket…">
		</div>
		<div class="filter-row" id="filters">
			<button class="chip is-active" data-filter="all">Semua</button>
			<button class="chip" data-filter="detached">Detached</button>
			<button class="chip" data-filter="attached">Attached</button>
		</div>
	</header>

	<main id="apps-list" class="apps-list" aria-live="polite"></main>

	<p class="empty-state" id="empty-state" hidden>Tidak ada paket yang cocok.</p>
	<p class="loading-state" id="loading-state">Memuat daftar paket…</p>

	<div class="action-bar" id="action-bar">
		<span class="pending-label" id="pending-label">Tidak ada perubahan</span>
		<button class="apply-btn" id="detach">Terapkan</button>
	</div>

	<template id="app-template">
		<div class="app-row">
			<label class="switch">
				<input type="checkbox" class="checkbox">
				<span class="track">
					<span class="wire wire-left"></span>
					<span class="wire wire-right"></span>
					<span class="knob"></span>
				</span>
			</label>
			<div class="app-info">
				<p class="name"></p>
				<p class="state-label"></p>
			</div>
		</div>
	</template>
</body>

</html>
